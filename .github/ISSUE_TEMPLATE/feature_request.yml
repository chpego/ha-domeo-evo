name: Feature request
description: Suggest something the integration should do.
labels: [enhancement]
body:
  - type: textarea
    id: request
    attributes:
      label: What you would like
    validations:
      required: true
  - type: input
    id: unit
    attributes:
      label: Your unit
      description: Model and variant, if you have one to test with.
      placeholder: DOMEO EVO 315 DHU
