name: Bug report
description: Something does not work with your DOMEO EVO.
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Before you report: check that jumper **JP1** is closed on the unit's board
        (the **Modbus control (JP1)** entity should be on), and that the gateway is set
        to **19200 baud, 8 data bits, even parity, 1 stop bit**.

        Avant de signaler un problème : vérifiez que le cavalier **JP1** est fermé et que la
        passerelle est en **19200 bauds, 8 bits, parité paire, 1 bit de stop**. Vous pouvez
        écrire en français.
  - type: checkboxes
    id: existing-issue
    attributes:
      label: Existing issues
      options:
        - label: I searched the open and closed issues and found none for this problem
          required: true
  - type: dropdown
    id: model
    attributes:
      label: Model
      options:
        - "225"
        - "315"
        - "450"
    validations:
      required: true
  - type: dropdown
    id: variant
    attributes:
      label: Variant
      options:
        - FL (wired control panel)
        - RD (radio control panel)
        - DHU
        - Sérénité
        - Not sure
    validations:
      required: true
  - type: input
    id: link
    attributes:
      label: Gateway or adapter
      placeholder: Waveshare RS485 TO POE ETH (B), Elfin EW11, USB RS485 adapter…
    validations:
      required: true
  - type: input
    id: ha-version
    attributes:
      label: Home Assistant version
      description: Settings → About
      placeholder: "2026.11.1"
    validations:
      required: true
  - type: input
    id: integration-version
    attributes:
      label: Integration version
      description: Settings → Marketplace → S&P DOMEO EVO
      placeholder: 0.2.0-beta.1
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What happens, and what you expected
      description: For a command, say what the unit did (airflow, control panel display).
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: |
        On the integration's card: ⋮ → Download diagnostics. Drag the file here
        (if GitHub refuses it, zip it first). The gateway address is redacted.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Lines from Settings → System → Logs that mention domeo_evo, if any. See "Debug logs" in the README.
      render: text
